<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Nemotron</title>
    <!-- Menggunakan Google Fonts 'Inter' untuk tampilan modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <div>
                    <h1>Chatbot AI</h1>
                    <p>Online • Siap membantu</p>
                </div>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                <div class="message-content">Halo! Ada yang bisa saya bantu hari ini?</div>
            </div>
        </div>

        <form id="chat-form" class="chat-form">
            <input
                type="text"
                id="user-input"
                placeholder="Ketik pesan Anda..."
                autocomplete="off"
                required
            >
            <button type="submit" aria-label="Kirim pesan">
                <span>Kirim</span>
                <!-- Ikon panah kirim SVG -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
